{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - ThriveAI</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
width:100%;
">

    <div class="analytics-card"
         style="
         width:420px;
         padding:40px;
         ">

        <h1 style="margin-bottom:10px;">
            Create Account 🚀
        </h1>

        <p style="
        color:#94a3b8;
        margin-bottom:30px;
        ">

            Start building better habits today.

        </p>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Username"
                   class="form-control mb-3"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   class="form-control mb-3"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   class="form-control mb-4"
                   required>

            <button class="health-btn"
                    style="width:100%;">

                Register

            </button>

        </form>

        <p style="
        margin-top:20px;
        text-align:center;
        ">

            Already have an account?

            <a href="{% url 'login' %}"
               style="color:#8b5cf6;">

               Login

            </a>

        </p>

    </div>

</div>

</body>
</html>
